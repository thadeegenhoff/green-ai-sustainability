name: Validate measurement stack
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_flow.js
      - name: Configure disposable local stack
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          p = Path('.env')
          text = p.read_text().replace('set_your_own_password', 'ci-local-password')
          text = text.replace('INSERT_TOKEN', 'ci-local-token-for-disposable-stack-only')
          p.write_text(text)
          PY
          docker compose config --quiet
      - run: docker compose up -d --build
      - run: python tests/smoke_stack.py
      - if: failure()
        run: docker compose logs --tail=150
      - if: always()
        run: docker compose down --volumes
